apiVersion: v2
name: fraud-detection
description: A fraud detection system with ML training and inference services
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - fraud-detection
  - machine-learning
  - kubernetes
  - mlops
home: https://github.com/your-org/fraud-detection
sources:
  - https://github.com/your-org/fraud-detection
maintainers:
  - name: Your Name
    email: your.email@example.com
dependencies:
  - name: kafka
    version: "22.1.5"
    repository: "https://charts.bitnami.com/bitnami"
    condition: kafka.enabled
  - name: redis
    version: "17.11.3"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: prometheus
    version: "25.8.1"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: monitoring.prometheus.enabled
  - name: grafana
    version: "6.61.0"
    repository: "https://grafana.github.io/helm-charts"
    condition: monitoring.grafana.enabled
