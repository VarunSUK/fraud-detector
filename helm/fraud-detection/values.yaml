# Default values for fraud-detection
# This is a YAML-formatted file.

# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# Cloud provider configuration
cloud:
  provider: "aws"  # aws, gcp, azure
  region: "us-west-2"
  cluster:
    name: "fraud-detection-cluster"
  
  # AWS specific settings
  aws:
    eks:
      clusterName: "fraud-detection-eks"
      nodeGroupName: "fraud-detection-nodes"
    s3:
      bucket: "fraud-detection-models"
      region: "us-west-2"
    iam:
      serviceAccount: "fraud-detection-sa"
      roleArn: "arn:aws:iam::ACCOUNT:role/fraud-detection-role"
  
  # GCP specific settings
  gcp:
    gke:
      clusterName: "fraud-detection-gke"
      zone: "us-west2-a"
    gcs:
      bucket: "fraud-detection-models"
    workloadIdentity:
      serviceAccount: "fraud-detection@PROJECT.iam.gserviceaccount.com"
  
  # Azure specific settings
  azure:
    aks:
      clusterName: "fraud-detection-aks"
      resourceGroup: "fraud-detection-rg"
    blob:
      container: "fraud-detection-models"
    managedIdentity:
      clientId: "MANAGED-IDENTITY-CLIENT-ID"

# ML Training Service
mlTraining:
  enabled: true
  image:
    repository: fraud-detection-ml-training
    tag: "latest"
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 1000m
      memory: 2Gi
  env:
    - name: PYTHONPATH
      value: "/app/src"
    - name: PYTHONUNBUFFERED
      value: "1"
  volumeMounts:
    - name: models-volume
      mountPath: /app/models
    - name: data-volume
      mountPath: /app/data
  volumes:
    - name: models-volume
      persistentVolumeClaim:
        claimName: ml-models-pvc
    - name: data-volume
      persistentVolumeClaim:
        claimName: ml-data-pvc
  command:
    - "python"
    - "train.py"
    - "--data-file"
    - "/app/data/creditcard.csv"
    - "--dataset-type"
    - "creditcard"
    - "--sample-size"
    - "10000"

# Inference API Service
inferenceAPI:
  enabled: true
  image:
    repository: fraud-detection-inference
    tag: "latest"
    pullPolicy: IfNotPresent
  replicaCount: 3
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
      - host: fraud-detection-api.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: fraud-detection-tls
        hosts:
          - fraud-detection-api.example.com
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi
  env:
    - name: PORT
      value: "8080"
    - name: MODELS_DIR
      value: "/app/models"
    - name: LOG_LEVEL
      value: "info"
    - name: VERSION
      value: "1.0.0"
  volumeMounts:
    - name: models-volume
      mountPath: /app/models
  volumes:
    - name: models-volume
      persistentVolumeClaim:
        claimName: ml-models-pvc
  healthCheck:
    enabled: true
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  livenessProbe:
    enabled: true
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    enabled: true
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Data Generator Service
dataGenerator:
  enabled: true
  image:
    repository: fraud-detection-data-generator
    tag: "latest"
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  env:
    - name: PYTHONPATH
      value: "/app/src"
    - name: PYTHONUNBUFFERED
      value: "1"
  volumeMounts:
    - name: data-volume
      mountPath: /app/data
  volumes:
    - name: data-volume
      persistentVolumeClaim:
        claimName: ml-data-pvc
  command:
    - "python"
    - "src/stream_producer.py"
    - "--csv-file"
    - "/app/data/creditcard.csv"
    - "--kafka"
    - "--redis"
    - "--sample-rate"
    - "0.01"
    - "--delay"
    - "0.1"

# Kafka Configuration
kafka:
  enabled: true
  replicaCount: 1
  persistence:
    enabled: true
    size: 10Gi
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# Redis Configuration
redis:
  enabled: true
  master:
    replicaCount: 1
    persistence:
      enabled: true
      size: 5Gi
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi
  replica:
    replicaCount: 1
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi

# Monitoring Configuration
monitoring:
  enabled: true
  namespace: monitoring
  
  # Prometheus
  prometheus:
    enabled: true
    server:
      persistentVolume:
        enabled: true
        size: 50Gi
      resources:
        limits:
          cpu: 2000m
          memory: 4Gi
        requests:
          cpu: 1000m
          memory: 2Gi
      retention: "15d"
  
  # Grafana
  grafana:
    enabled: true
    adminPassword: "admin"
    persistence:
      enabled: true
      size: 10Gi
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi
    service:
      type: ClusterIP
      port: 80
    ingress:
      enabled: true
      className: "nginx"
      annotations:
        nginx.ingress.kubernetes.io/rewrite-target: /
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
      hosts:
        - host: grafana.example.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: grafana-tls
          hosts:
            - grafana.example.com

# Persistent Volumes
persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size:
    models: 10Gi
    data: 20Gi

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod Security Context
podSecurityContext:
  fsGroup: 2000

# Security Context
securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# Node Selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}
